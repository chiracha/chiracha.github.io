<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Tracker - เครื่องคำนวณเวลาขึ้น-ตกของดวงอาทิตย์</title>
    <style>
        :root {
            --primary: #ff7e5f;
            --secondary: #feb47b;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e38 0%, #0f172a 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .input-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(255, 126, 95, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 126, 95, 0.4);
        }

        /* Graphic & Output Section */
        .display-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sky-graphic {
            width: 100%;
            height: 180px;
            position: relative;
            margin-bottom: 20px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .result-card p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .result-card h2 {
            font-size: 1.4rem;
            color: #fff;
        }

        .result-card.sunrise h2 { color: #feb47b; }
        .result-card.sunset h2 { color: #ff7e5f; }

        /* SVG Path Animation Customization */
        #sun {
            transition: all 1s ease-in-out;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Input Panel -->
    <div class="input-section">
        <h1>Sun Tracker</h1>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">คำนวณเวลาดวงอาทิตย์ขึ้น-ตกตามหลักตรีโกณมิติทรงกลม</p>
        
        <div class="form-group">
            <label for="latitude">ละติจูด (Latitude เช่น กรุงเทพฯ = 13.75)</label>
            <input type="number" id="latitude" step="any" value="13.75">
        </div>
        
        <div class="form-group">
            <label for="longitude">ลองจิจูด (Longitude เช่น กรุงเทพฯ = 100.51)</label>
            <input type="number" id="longitude" step="any" value="100.51">
        </div>

        <div class="form-group">
            <label for="date">วันที่ต้องการคำนวณ</label>
            <input type="date" id="date">
        </div>

        <button class="btn-submit" onclick="calculateSunTimes()">คำนวณผลลัพธ์</button>
    </div>

    <!-- Graphical Panel -->
    <div class="display-section">
        <!-- SVG Orbit Graphic -->
        <div class="sky-graphic">
            <svg width="100%" height="100%" viewBox="0 0 300 150" preserveAspectRatio="xMidYMid meet">
                <!-- Horizon line -->
                <line x1="10" y1="130" x2="290" y2="130" stroke="#475569" stroke-width="2" stroke-dasharray="4"/>
                
                <!-- Sun Path (Arc) -->
                <path d="M 30 130 A 110 110 0 0 1 270 130" fill="none" stroke="rgba(254, 180, 123, 0.3)" stroke-width="3" id="sun-path"/>
                
                <!-- Sun Element -->
                <circle id="sun" cx="150" cy="40" r="10" fill="url(#sun-gradient)" filter="drop-shadow(0px 0px 8px #ff7e5f)" />
                
                <!-- Text Labels -->
                <text x="25" y="145" fill="#94a3b8" font-size="10">ทิศตะวันออก</text>
                <text x="235" y="145" fill="#94a3b8" font-size="10">ทิศตะวันตก</text>

                <!-- Gradients Definition -->
                <defs>
                    <linearGradient id="sun-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#feb47b" />
                        <stop offset="100%" stop-color="#ff7e5f" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Output Cards -->
        <div class="results-grid">
            <div class="result-card sunrise">
                <p>🌅 ดวงอาทิตย์ขึ้น</p>
                <h2 id="sunrise-time">--:--</h2>
            </div>
            <div class="result-card sunset">
                <p>🌇 ดวงอาทิตย์ตก</p>
                <h2 id="sunset-time">--:--</h2>
            </div>
            <div class="result-card">
                <p>☀️ เที่ยงวันสุริยคติ</p>
                <h2 id="solarnoon-time" style="font-size: 1.2rem;">--:--</h2>
            </div>
            <div class="result-card">
                <p>⏳ ความยาวกลางวัน</p>
                <h2 id="day-length" style="font-size: 1.2rem; color: #a7f3d0;">--:-- ชม.</h2>
            </div>
        </div>
    </div>
</div>

<script>
    // ตั้งค่าเริ่มต้นให้ Input Date เป็นวันปัจจุบัน
    document.getElementById('date').valueAsDate = new Date();

    function calculateSunTimes() {
        const lat = parseFloat(document.getElementById('latitude').value);
        const lng = parseFloat(document.getElementById('longitude').value);
        const dateInput = new Date(document.getElementById('date').value);

        if (isNaN(lat) || isNaN(lng) || !dateInput) {
            alert("กรุณากรอกข้อมูลให้ครบถ้วนและถูกต้อง");
            return;
        }

        // 1. หาค่า Day of Year (N)
        const start = new Date(dateInput.getFullYear(), 0, 0);
        const diff = dateInput - start;
        const oneDay = 1000 * 60 * 60 * 24;
        const N = Math.floor(diff / oneDay);

        // แปลงองศาเป็นเรเดียน
        const toRad = Math.PI / 180;
        const toDeg = 180 / Math.PI;

        // 2. คำนวณค่า Solar Declination (delta) แบบประมาณการแม่นยำพื้นฐาน
        // สูตรดาราศาสตร์มุมเอียงของดวงอาทิตย์ในวันนั้นๆ ของปี
        const delta = 23.45 * Math.sin(toRad * (360 / 365 * (N - 80)));

        // 3. คำนวณ Equation of Time (EoT) เป็นนาที
        const B = (360 / 365) * (N - 81) * toRad;
        const EoT = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);

        // 4. หาระยะห่างทางดาราศาสตร์ (คิดผลสะท้อนชั้นบรรยากาศหักเหแสง -0.833 องศา)
        const z = 90.833 * toRad;
        const latRad = lat * toRad;
        const decRad = delta * toRad;

        // Sunrise Equation 
        let cosH = (Math.cos(z) - Math.sin(latRad) * Math.sin(decRad)) / (Math.cos(latRad) * Math.cos(decRad));

        // ตรวจสอบเคสเขตขั้วโลก (คืนเดือนหงาย/มืดมิดตลอดวัน)
        if (cosH > 1) {
            document.getElementById('sunrise-time').innerText = "ไม่ขึ้น";
            document.getElementById('sunset-time').innerText = "ไม่ตก";
            return;
        } else if (cosH < -1) {
            document.getElementById('sunrise-time').innerText = "สว่างทั้งวัน";
            document.getElementById('sunset-time').innerText = "สว่างทั้งวัน";
            return;
        }

        // คำนวณค่า Hour Angle (H) ออกมาเป็นองศาแล้วแปลงเป็นชั่วโมง
        const H = Math.acos(cosH) * toDeg;
        const hourLength = H / 15; // เวลาครึ่งวันจากเที่ยงวัน

        // 5. หาเวลาเที่ยงวันจริง (Solar Noon) ปรับตามเขตเวลามาตรฐานประเทศไทย (UTC+7 หรือ ลองจิจูด 105)
        const standardMeridian = 105; 
        const timeZoneCorrection = (standardMeridian - lng) / 15;
        const solarNoonDec = 12 + timeZoneCorrection - (EoT / 60);

        // 6. คำนวณเวลาขึ้นและตก
        const sunriseUTC = solarNoonDec - hourLength;
        const sunsetUTC = solarNoonDec + hourLength;

        // ฟังก์ชันแปลงเลขทศนิยมชั่วโมงให้เป็นข้อความ HH:MM
        function formatTime(decimalHours) {
            let hours = Math.floor(decimalHours);
            let minutes = Math.floor((decimalHours - hours) * 60);
            if (hours >= 24) hours -= 24;
            if (hours < 0) hours += 24;
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }

        // แสดงผลตัวเลข
        document.getElementById('sunrise-time').innerText = formatTime(sunriseUTC);
        document.getElementById('sunset-time').innerText = formatTime(sunsetUTC);
        document.getElementById('solarnoon-time').innerText = formatTime(solarNoonDec);
        
        const durationHours = hourLength * 2;
        const dHours = Math.floor(durationHours);
        const dMins = Math.floor((durationHours - dHours) * 60);
        document.getElementById('day-length').innerText = `${dHours}:${String(dMins).padStart(2, '0')} ชม.`;

        // 7. เคลื่อนย้ายตำแหน่งลูกบอลดวงอาทิตย์ (SVG Animation) ไปไว้ตรงจุดยอดสูงสุดชั่วคราวเพื่อความสวยงาม
        animateSun();
    }

    function animateSun() {
        const sun = document.getElementById('sun');
        // ทำอนิเมชันให้วิ่งขึ้นจุดสูงสุดเมื่อคำนวณเสร็จสิ้น
        sun.setAttribute('cx', '150');
        sun.setAttribute('cy', '20');
    }

    // สั่งให้คำนวณรอบแรกทันทีเมื่อโหลดหน้าเว็บ
    window.onload = calculateSunTimes;
</script>

</body>
</html>
